[project]
name = "cogito"
version = "0.2.0"
description = "A coding agent whose harness compensates for the model"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Jeffrey Romero Del Val" }]

dependencies = [
    "neo4j>=5.0",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "platformdirs>=4.2",
    "click>=8.1",
    "bashlex>=0.18",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anthropic>=1.9.0",
    "pypdfium2>=5.13",
    # Windows only: process trees, liveness and listening ports, which POSIX reads from
    # /proc (cogito/procs.py).
    "psutil>=7.0; sys_platform == 'win32'",
    "jeepney>=0.9 ; sys_platform == 'linux'",
    "pillow>=11",
]

[project.optional-dependencies]
# Speech in and out (voice_listen, voice_speak). Off in settings by default.
voice = ["cogito-vox[local]"]

[project.scripts]
cogito = "cogito.cli:main"

[tool.uv.sources]
cogito-vox = { path = "../cogito-vox", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/cogito"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
